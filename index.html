<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Feed">
<title>Feed</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="app.css?v=10">
</head><body>
<header id="top">
  <div class="bar"><button id="refreshBtn" class="ic" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button><div class="ttl"><h1>Discover</h1><span id="upd"></span></div><div class="rbtn"><button id="libBtn" class="ic" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button><button id="searchBtn" class="ic" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div></div>
  <div id="searchRow" hidden><input id="q" type="search" placeholder="Search stories" autocomplete="off"><button id="searchClose" class="txt">Cancel</button></div>
  <nav id="tabs" role="tablist"></nav>
</header>
<div id="ptr" aria-hidden="true"><span>↓ Pull to refresh</span></div><main id="feed"></main>
<div id="sentinel"></div>
<div id="sheet" hidden><div class="scrim"></div><div class="panel"><div class="grab"></div><div class="sheetHead"><b>Ask follow-up</b><button class="ic close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="chat"></div><div id="sugg"></div><form id="askForm"><input id="askIn" placeholder="Ask anything about this story…" autocomplete="off"><button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></form></div></div>
<div id="lib" hidden role="dialog" aria-label="Library"><div class="libHead"><button class="ic libClose" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Library</h2><span></span></div><div class="libTabs" role="tablist"><button role="tab" data-t="saved" aria-selected="true">Saved</button><button role="tab" data-t="liked" aria-selected="false">Liked</button></div><div class="libSearch"><input id="libQ" type="search" placeholder="Search saved and liked" autocomplete="off"></div><ul id="libList"></ul></div>
<div id="menu" hidden role="menu"></div><div id="sides" hidden></div><div id="toast" hidden role="status"></div>
<div id="nudge" hidden></div>
<script src="app.js?v=11"></script></body></html>
